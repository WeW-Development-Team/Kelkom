@if (hasContent()) {
<div class="home__card" [style.width]="size()">
    <div class="home__card-inner">

        <!-- Cara frontal -->
        <div class="home__card-front">
            <h3>{{ title() }}</h3>
        </div>

        <!-- Cara trasera -->
        <div class="home__card-back">
            <p>{{ text() }}</p>
        </div>

    </div>
</div>
}
