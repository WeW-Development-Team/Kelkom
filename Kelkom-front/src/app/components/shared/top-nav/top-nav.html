<ul ngbNav #nav="ngbNav" class="nav-tabs" style="
                                                justify-content: center;
                                                position: sticky;
                                                top: 0;
                                                z-index: 9999;
                                                background: rgb(206, 206, 206);
                                                border-bottom: 1px rgb(192, 0, 199) solid;
                                                padding-top: 5px;
                                                gap: 40px;"
                                                >
    @for (tab of tabList; track tab.name) {
        <li ngbNavItem class="">
            <button ngbNavLink>{{tab.name}}</button>
            <ng-template ngbNavContent>
                <ng-container *ngComponentOutlet="tab.content"></ng-container>
            </ng-template>
        </li>
    }
</ul>
<div [ngbNavOutlet]="nav"></div>
